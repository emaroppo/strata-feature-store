[project]
name = "strata-feature-store"
version = "0.1.0"
description = "Point-in-time correct storage, standardisation and retrieval for revised panel data"
requires-python = ">=3.13"
dependencies = [
    # The spec subpackage needs this and nothing else. Everything below is
    # store-only; see the purity test in tests/spec.
    "pydantic>=2.7",
    # The canonical form that gets hashed, one implementation across the strata packages.
    "strata-common>=0.1,<0.2",
    # Catalog. psycopg because there is no SQLite fallback by design.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # Bytes in, bytes out.
    "boto3>=1.34",
    # Reading source files and writing long-format parquet.
    "pyarrow>=16.0",
    "polars>=1.0",
    # Composition. Reads parquet straight from the bucket over httpfs.
    "duckdb>=1.0",
    # CLI.
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
strata-feature-store = "strata.feature_store.store.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no src/strata/__init__.py, or it stops merging with the other strata packages
packages = ["src/strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Postgres and a live Garage container",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned: ruff's default set widens between releases. The same set as the
# other strata packages, widened once, on purpose.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]
# Every timestamp is naive UTC by decision (docs/adr/0012), so the rules
# that ask for a tzinfo would ask for the opposite of the design.
ignore = ["DTZ001", "DTZ005"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these, and it emits table and column comments as single long
# string literals that no formatter can split. Rewrapping them by hand after
# every autogenerate is the kind of friction that gets skipped once and then
# always, so the line limit is lifted here and nowhere else. Everything except
# line length still applies.
# F401: the template always imports op and sa. A migration whose body is empty
# has them unused, ruff --fix strips them, and the next hand-edit that needs op
# fails with a NameError at migration time rather than at lint time.
"src/strata/feature_store/store/migrations/versions/*" = ["E501", "F401"]
# typer declares options as call defaults; that is its idiom, not a bug
"src/strata/feature_store/store/cli.py" = ["B008"]
