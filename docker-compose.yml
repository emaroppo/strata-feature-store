# Local development and tests only. Real use points at a Garage instance
# elsewhere via config.toml; this exists so the test suite has a throwaway
# bucket it is free to wipe.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feature_store
      POSTGRES_PASSWORD: feature_store
      POSTGRES_DB: feature_store
    ports:
      # 5432 and 5433 are taken by neighbouring projects on this host.
      # The container port is untouched; only the host mapping moves.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feature_store"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # Garage rather than MinIO: MinIO's OSS repository was marked unmaintained
    # in December 2025. See docs/adr.
    image: dxflrs/garage:v1.0.1
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3903:3903"
    healthcheck:
      # Exec form, not CMD-SHELL: this image has no shell to run one in.
      # Note that passing here means garage is answering, NOT that it will
      # accept writes - a node with no layout answers happily and refuses
      # every PUT. scripts/garage-bootstrap.sh is what closes that gap.
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  garage-meta:
  garage-data:
